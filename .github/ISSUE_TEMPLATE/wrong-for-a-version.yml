name: Wrong for a nopCommerce version
description: Claude or the upgrade scan gave advice that is wrong for a specific nopCommerce version
labels: ["accuracy"]
body:
  - type: dropdown
    id: version
    attributes:
      label: nopCommerce version
      options: ["5.00.x", "4.90.x", "4.80.x", "4.70.x", "Other"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["nop-plugin (build or scaffold plugins)", "nop-theme", "nop-migrate or the upgrade scan", "nop-audit", "nop-bulk-migrator", "Other"]
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What was wrong
      description: Paste what Claude produced or the upgrade scan reported.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What is correct
      description: If you can, link the nopCommerce source file and release tag that shows it.
    validations:
      required: true
