name: Wrong for a nopCommerce version
description: Claude or the scanner gave advice that is wrong for a specific nopCommerce version
labels: ["accuracy"]
body:
  - type: dropdown
    id: version
    attributes:
      label: nopCommerce version
      options: ["4.90.x", "4.80.x", "4.70.x", "Other"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Plugin development", "Theme development", "/nop-new-plugin", "/nop-upgrade or scanner", "/nop-review", "Other"]
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What was wrong
      description: Paste what Claude produced or the scanner reported.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What is correct
      description: If you can, link the nopCommerce source file and release tag that shows it.
    validations:
      required: true
