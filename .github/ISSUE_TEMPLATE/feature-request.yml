name: Feature request
description: Suggest a new skill, command, scanner rule or version
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the Dev Kit to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter for your nopCommerce work?
