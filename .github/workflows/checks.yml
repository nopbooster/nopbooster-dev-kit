name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests are valid JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Every skill has a SKILL.md with name and description
        run: |
          set -e
          for d in skills/*/; do
            f="$d/SKILL.md"
            test -f "$f" || { echo "missing $f"; exit 1; }
            head -5 "$f" | grep -q '^name:' || { echo "no name in $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "no description in $f"; exit 1; }
          done
          echo "skills OK"

      - name: Only file types the plugin directory accepts
        run: |
          bad=$(git ls-files | grep -viE '\.(md|txt|json|ya?ml|png|jpe?g|gif|webp|ico)$' | grep -vxE 'LICENSE|\.gitignore' || true)
          if [ -n "$bad" ]; then echo "Not allowed in the plugin:"; echo "$bad"; exit 1; fi
          echo "file types OK"
